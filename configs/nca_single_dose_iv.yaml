schema_version: "0.1.0"
analysis: nca
design_route: iv_bolus
dosing: single_dose
sampling: rich_serial
auc_method: linear_up_log_down
lambda_z_min_points: 3
lambda_z_min_adjusted_r2: 0.90
auc_inf_max_extrapolated_fraction: 0.20
blq_rule: keep_as_censored
note: >
  Locked NCA design: single-dose IV bolus, rich serial sampling,
  linear-up/log-down. AUC infinity is reported only when the terminal phase
  meets the point-count and adjusted R^2 rules and the extrapolated fraction
  does not exceed the value below. That fraction is a reporting flag, not
  proof that a larger extrapolation is impossible.
