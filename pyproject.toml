[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pharmacoweave"
version = "0.2.10"
description = "Research-use data model and validation toolkit for quantitative pharmacology."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JianyunZhang" }]
keywords = ["pharmacology", "pharmacokinetics", "NCA", "PKPD", "bioanalysis"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pandas>=2.1",
    "pyarrow>=14",
    "pydantic>=2.10",
    "jinja2>=3.1",
    "PyYAML>=6",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
pharmacoweave = "pharmacoweave.cli:main"

[project.urls]
Homepage = "https://github.com/JianyunZhang/PharmacoWeave"
Repository = "https://github.com/JianyunZhang/PharmacoWeave"

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "pharmacoweave/data/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["pharmacoweave"]
strict = false
warn_unused_ignores = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["pyarrow.*", "pandas.*", "jinja2.*", "yaml.*", "jsonschema.*"]
ignore_missing_imports = true
